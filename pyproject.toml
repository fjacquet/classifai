[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "classifai"
version = "0.2.0"
description = "Classify and organize your files with local AI models."
authors = [
    {name = "ClassifAI Project", email = "fred.jacquet@gmail.com"},
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "beautifulsoup4",
    "extract-msg",
    "geopy",
    "langdetect>=1.0.9",
    "litellm",
    "loguru",
    "ollama",
    "openpyxl",
    "Pillow",
    "PyMuPDF",
    "pytesseract",
    "python-docx",
    "python-dotenv",
    "streamlit",
    "striprtf",
    "typer",
    "watchdog",
    "pydub",
    "moviepy",
    "SpeechRecognition",
    "openai-whisper>=20250625",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "yamlfix",
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "faker",
]

[project.scripts]
classifai = "classifai.classifai_cli:app"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v -rA --cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.yamlfix]
line-length = 110
