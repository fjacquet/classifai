site_name: ClassifAI Documentation
site_description: Documentation for the ClassifAI document classification and organization tool
site_author: ClassifAI Team
repo_url: https://github.com/fjacquet/classifai
repo_name: fjacquet/classifai

# Configuration
docs_dir: docs
site_dir: site
exclude_docs: |
  archive/

# Theme configuration
theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

# Plugins
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
  - git-revision-date-localized:
      type: date

# Navigation structure
nav:
  - Home: index.md
  - User Guide:
      - Overview: user-guide/index.md
      - Installation: user-guide/installation.md
      - Quickstart: user-guide/quickstart.md
      - CLI Reference: user-guide/cli.md
      - Web UI: user-guide/web-ui.md
      - Configuration: user-guide/configuration.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Product:
      - PRD: PRD.md
      - Document Types: DOCUMENTS_TYPES.md
  - Architecture Decisions:
      - Index: adr/README.md
      - 0001 · OCR engine (stay on Tesseract): adr/0001-ocr-engine-stay-on-tesseract.md
      - 0002 · Hybrid rule + LLM classification: adr/0002-hybrid-rule-plus-llm-classification.md
      - 0003 · Ollama as LLM runtime: adr/0003-ollama-as-llm-runtime.md
      - 0004 · Remove the returns library: adr/0004-remove-returns-library.md
      - 0005 · Three entry points (CLI / Web / API): adr/0005-three-entry-points-cli-web-api.md
      - 0006 · YAML-driven configuration: adr/0006-yaml-driven-configuration.md
  - Changelog: https://github.com/fjacquet/classifai/blob/main/CHANGELOG.md

extra:
  version: v0.2.0
